<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê - Hệ Thống Quản Lý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="stats.css">
</head>

<body>

    <div class="p-4" style="background-color: #f8fafc; min-height: 100vh;">
        <!-- Navigation -->
        <div class="d-flex justify-content-center gap-2 mb-4">
            <a href="../Test app/main.html" class="btn btn-primary rounded-pill px-4 shadow-sm text-decoration-none"><i
                    class='bx bxs-home'></i> Home</a>
            <a href="../Tasks/admin.html" class="btn btn-primary rounded-pill px-4 shadow-sm text-decoration-none"><i
                    class='bx bxs-spreadsheet'></i> Tasks</a>
            <a href="stats.html" class="btn btn-primary rounded-pill px-4 shadow-sm active text-decoration-none"><i
                    class='bx bxs-bar-chart-alt-2'></i> Thống kê</a>
        </div>

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1 text-dark">Báo cáo doanh thu</h4>
                <p class="text-secondary mb-0">Tổng quan tình hình kinh doanh của Flower Shop</p>
            </div>
            <button class="btn btn-outline-secondary shadow-sm bg-white" id="btnExportStats"><i
                    class='bx bx-export'></i> Xuất báo cáo</button>
        </div>

        <!-- Summary Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card d-flex align-items-center">
                    <div class="stat-icon bg-primary bg-opacity-10 text-primary me-3">
                        <i class='bx bx-money'></i>
                    </div>
                    <div>
                        <p class="text-secondary mb-1" style="font-size: 0.85rem; font-weight: 600;">TỔNG DOANH THU</p>
                        <h4 class="fw-bold mb-0 text-dark" id="totalRevenue">0 VND</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card d-flex align-items-center">
                    <div class="stat-icon bg-info bg-opacity-10 text-info me-3">
                        <i class='bx bx-shopping-bag'></i>
                    </div>
                    <div>
                        <p class="text-secondary mb-1" style="font-size: 0.85rem; font-weight: 600;">TỔNG ĐƠN HÀNG</p>
                        <h4 class="fw-bold mb-0 text-dark" id="totalOrders">0</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card d-flex align-items-center">
                    <div class="stat-icon bg-success bg-opacity-10 text-success me-3">
                        <i class='bx bx-check-circle'></i>
                    </div>
                    <div>
                        <p class="text-secondary mb-1" style="font-size: 0.85rem; font-weight: 600;">ĐÃ HOÀN THÀNH</p>
                        <h4 class="fw-bold mb-0 text-dark" id="completedOrders">0</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card d-flex align-items-center">
                    <div class="stat-icon bg-warning bg-opacity-10 text-warning me-3">
                        <i class='bx bx-time'></i>
                    </div>
                    <div>
                        <p class="text-secondary mb-1" style="font-size: 0.85rem; font-weight: 600;">ĐANG CHỜ XỬ LÝ</p>
                        <h4 class="fw-bold mb-0 text-dark" id="pendingOrders">0</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead>
                            <tr>
                                <th class="ps-4">Mã Đơn</th>
                                <th>Ngày Đặt</th>
                                <th>Khách Hàng & Thông Tin</th>
                                <th>Doanh Thu</th>
                                <th>Trạng Thái</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <!-- Dynamic rows -->
                        </tbody>
                    </table>
                    <div id="noOrdersMsg" class="text-center py-5 text-muted d-none">
                        Chưa có đơn hàng nào để thống kê
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bundle.min.js"></script>
    <script src="../Tasks/tasks.js"></script>
    <script src="stats.js"></script>
</body>

</html>
