<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ Sơ Cá Nhân - Flower Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="profile.css">
</head>

<body>
  <header class="top-header">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex flex-column">
        <a href="../Test app/main.html" class="logo-main text-decoration-none">
          <i class='bx bxs-flower'></i> Flower Shop
        </a>
      </div>
      <div class="d-flex align-items-center gap-4">
        <div class="badge-rank" id="headerRankBadge">
          <img src="" id="headerRankIcon" width="20" alt="rank">
          <span id="headerRankName">...</span>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <a href="../Test app/main.html" class="btn btn-light rounded-pill border d-flex align-items-center gap-2">
          <i class='bx bx-home'></i> Trang chủ
        </a>
        <div class="dropdown ms-3">
          <a href="#" class="d-flex align-items-center justify-content-center text-decoration-none dropdown-toggle"
            id="userMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
            <img src="" id="userAvatarImg" class="rounded-circle border"
              style="width: 42px; height: 42px; object-fit: cover;" alt="Avatar">
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userMenuButton">
            <li>
              <h6 class="dropdown-header" id="userGreetingName">Xin chào!</h6>
            </li>
            <li><a class="dropdown-item text-danger" href="../login&register/Login/login.html" id="btnLogout"><i
                  class='bx bx-log-out'></i> Đăng xuất</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <div class="container my-5">
    <h3 class="fw-bold mb-4">Hồ Sơ Của Bạn</h3>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="profile-card text-center">
          <div class="position-relative d-inline-block mb-3">
            <img src="" id="profileAvatar" class="rounded-circle border border-3 border-primary"
              style="width: 150px; height: 150px; object-fit: cover;" alt="Avatar">
            <button class="btn btn-primary rounded-circle position-absolute bottom-0 end-0" data-bs-toggle="modal"
              data-bs-target="#changeAvatarModal"
              style="width: 40px; height: 40px; display:flex; align-items:center; justify-content:center;">
              <i class='bx bx-camera'></i>
            </button>
          </div>
          <h4 class="fw-bold mb-1" id="profileName">...</h4>
          <p class="text-muted mb-3">@<span id="profileUsername">...</span></p>
          <span class="badge bg-secondary mb-4" id="profileRole">...</span>
        </div>
      </div>
      <div class="col-md-8">
        <div class="profile-card">
          <h5 class="fw-bold mb-4"><i class='bx bx-bar-chart-alt-2 text-primary'></i> Hạng Thành Viên</h5>
          <div class="d-flex align-items-center mb-3">
            <img src="" id="cardRankIcon" width="50" class="me-3">
            <div>
              <h4 class="fw-bold mb-0 text-primary" id="cardRankName">...</h4>
              <p class="text-muted mb-0">Hạng hiện tại của bạn</p>
            </div>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between mb-1">
              <span class="small fw-semibold text-muted">Tích lũy: <span id="accumulatedSpendText">0đ</span></span>
              <span class="small fw-semibold text-muted" id="nextRankText">...</span>
            </div>
            <div class="progress" style="height: 10px;">
              <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated" id="rankProgressBar"
                role="progressbar" style="width: 0%;"></div>
            </div>
          </div>
          <h5 class="fw-bold mb-3 mt-5"><i class='bx bxs-coupon text-danger'></i> Mã Giảm Giá Của Bạn</h5>
          <div id="discountCodesList">
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-white border-top py-5 mt-5">
    <div class="container text-center">
      <div class="mb-4">
        <i class='bx bxs-flower fs-1 text-primary'></i>
        <h4 class="mt-2 fw-bold">Flower Shop</h4>
        <p class="text-muted small">© 2026. Tất cả quyền được bảo lưu.</p>
      </div>
    </div>
  </footer>

  <!-- Modal Đổi Avatar -->
  <div class="modal fade" id="changeAvatarModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">Đổi Avatar</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="changeAvatarForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Chọn file ảnh</label>
              <input type="file" accept="image/*" class="form-control" id="newAvatarFile" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill"
              style="background:#8b5cf6; border-color:#8b5cf6;">Cập nhật Avatar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="profile_rank.js"></script>
</body>

</html>
