<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin nhắn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <style>
        body {
            background: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .back-btn {
            font-size: 24px;
            color: white;
            border: none;
            background: rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        .navbar-title {
            color: white;
            margin-bottom: 0;
        }
        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            margin: 0;
        }
        .user-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #667eea;
        }
        .user-meta h6 {
            margin: 0;
            font-weight: 700;
            color: #333;
        }
        .online-badge {
            color: #28a745;
            font-size: 12px;
        }
        .chat-container {
            display: flex;
            gap: 15px;
            height: calc(100vh - 200px);
            padding: 20px;
        }
        .chat-main {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .online-dot {
            width: 10px;
            height: 10px;
            background: #28a745;
            border-radius: 50%;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            display: flex;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message.sent {
            justify-content: flex-end;
        }
        .message-bubble {
            max-width: 60%;
            padding: 12px 15px;
            border-radius: 12px;
            word-wrap: break-word;
        }
        .message.received .message-bubble {
            background: #e9ecef;
            color: #333;
            border-radius: 12px 12px 12px 0;
        }
        .message.sent .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 12px;
        }
        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }
        .composer {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        .message-input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 14px;
        }
        .message-input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-send:active {
            transform: translateY(0);
        }
        .btn-clear {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-clear:hover {
            background: #c82333;
            transform: scale(1.05);
        }
        .sidebar-tips {
            width: 250px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        .sidebar-tips h6 {
            font-weight: 700;
            margin-bottom: 15px;
            color: #333;
        }
        .sidebar-tips ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-tips li {
            padding: 8px 0;
            color: #666;
            font-size: 14px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
            margin-bottom: 10px;
        }
        @media (max-width: 768px) {
            .chat-container {
                flex-direction: column;
                height: auto;
            }
            .sidebar-tips {
                width: 100%;
                max-height: none;
            }
            .message-bubble {
                max-width: 80%;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <nav class="navbar-custom">
        <div class="container-fluid d-flex align-items-center gap-3">
            <button class="back-btn" id="backBtn" title="Quay lại trang chủ">←</button>
            <div>
                <h5 class="navbar-title">Tin nhắn</h5>
                <p class="subtitle">Chat demo (lưu trong localStorage)</p>
            </div>
            <div class="ms-auto user-card">
                <img id="meAvatar" class="user-avatar" alt="Avatar" src="https://ui-avatars.com/api/?name=User&background=667eea&color=fff">
                <div class="user-meta">
                    <h6 id="meName">Người dùng</h6>
                    <small class="online-badge">🟢 Online</small>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Chat Area -->
    <div class="chat-container">
        <div class="chat-main">
            <!-- Chat header -->
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="online-dot"></div>
                    <div>
                        <h6 class="mb-0">Hỗ trợ</h6>
                        <small class="text-muted">Trả lời nhanh • 24/7</small>
                    </div>
                </div>
                <button class="btn-clear" id="clearBtn" title="Xóa toàn bộ tin nhắn">
                    <i class='bx bx-trash'></i> Xóa chat
                </button>
            </div>

            <!-- Messages area -->
            <div id="messages" class="messages"></div>

            <!-- Message composer -->
            <form id="composer" class="composer" autocomplete="off">
                <input 
                    id="messageInput" 
                    class="message-input" 
                    type="text" 
                    placeholder="Nhập tin nhắn... (Enter để gửi)" 
                    aria-label="Nhập tin nhắn"
                    required
                >
                <button 
                    class="btn-send" 
                    id="sendBtn" 
                    type="submit" 
                    title="Gửi tin nhắn (Enter)"
                >
                    <i class='bx bx-send'></i> Gửi
                </button>
            </form>
        </div>

        <!-- Sidebar tips -->
        <aside class="sidebar-tips">
            <h6><i class='bx bx-bulb'></i> Gợi ý</h6>
            <ul>
                <li><strong>Enter:</strong> Gửi tin nhắn nhanh</li>
                <li><strong>Lưu:</strong> Tin nhắn được lưu trong localStorage</li>
                <li><strong>Avatar:</strong> Từ trang Home/Profile</li>
                <li><strong>Thời gian:</strong> Tự động ghi lại</li>
                <li><strong>Xóa:</strong> Xóa tất cả tin nhắn</li>
            </ul>
        </aside>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../login&register/AccountSystem/auth.js" defer></script>
    <script>
        $(document).ready(function() {
            const STORAGE_KEY = 'chat_messages';
            const USER_KEY = 'user_profile';

            // Load user info
            function loadUserInfo() {
                const userProfile = localStorage.getItem(USER_KEY);
                if (userProfile) {
                    const user = JSON.parse(userProfile);
                    $('#meName').text(user.name || 'Người dùng');
                    $('#meAvatar').attr('src', `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || 'User')}&background=667eea&color=fff`);
                }
            }

            // Load messages from localStorage
            function loadMessages() {
                const messages = localStorage.getItem(STORAGE_KEY);
                $('#messages').html('');
                if (messages) {
                    const msgArray = JSON.parse(messages);
                    msgArray.forEach(msg => {
                        displayMessage(msg);
                    });
                    $('#messages').scrollTop($('#messages')[0].scrollHeight);
                }
            }

            // Display message
            function displayMessage(msg) {
                const time = new Date(msg.timestamp).toLocaleTimeString('vi-VN');
                const messageClass = msg.type === 'sent' ? 'sent' : 'received';
                const html = `
                    <div class="message ${messageClass}">
                        <div>
                            <div class="message-bubble">${escapeHtml(msg.text)}</div>
                            <div class="message-time">${time}</div>
                        </div>
                    </div>
                `;
                $('#messages').append(html);
            }

            // Escape HTML
            function escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }

            // Send message
            $('#composer').on('submit', function(e) {
                e.preventDefault();
                const text = $('#messageInput').val().trim();
                if (!text) return;

                const msg = {
                    type: 'sent',
                    text: text,
                    timestamp: new Date().toISOString()
                };

                // Save to storage
                let messages = localStorage.getItem(STORAGE_KEY);
                messages = messages ? JSON.parse(messages) : [];
                messages.push(msg);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));

                // Display message
                displayMessage(msg);
                $('#messageInput').val('').focus();
                $('#messages').scrollTop($('#messages')[0].scrollHeight);

                // Simulate reply
                setTimeout(() => {
                    const reply = {
                        type: 'received',
                        text: 'Cảm ơn bạn đã liên hệ. Chúng tôi sẽ trả lời sớm nhất!',
                        timestamp: new Date().toISOString()
                    };
                    messages.push(reply);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
                    displayMessage(reply);
                    $('#messages').scrollTop($('#messages')[0].scrollHeight);
                }, 1000);
            });

            // Clear chat
            $('#clearBtn').on('click', function() {
                if (confirm('Bạn có chắc muốn xóa toàn bộ tin nhắn?')) {
                    localStorage.removeItem(STORAGE_KEY);
                    $('#messages').html('<div class="text-center text-muted mt-5">Chưa có tin nhắn nào</div>');
                }
            });

            // Back button
            $('#backBtn').on('click', function() {
                window.location.href = '../Test app/test.html';
            });

            // Initialize
            loadUserInfo();
            loadMessages();
        });
    </script>
</body>
</html>
