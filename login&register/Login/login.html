<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Flower Shop</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Boxicons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div class="login-card">
    <h3><i class='bx bxs-flower'></i> Flower Shop</h3>
    <p class="text-center text-muted mb-4">Vui lòng đăng nhập để tiếp tục</p>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Tên đăng nhập</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class='bx bx-user'></i></span>
          <input type="text" class="form-control" id="username" required placeholder="admin hoặc user">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class='bx bx-lock-alt'></i></span>
          <input type="password" class="form-control" id="password" required placeholder="admin123 hoặc user123">
        </div>
      </div>
      <div id="loginError" class="alert alert-danger d-none py-2 text-center small">Sai tên đăng nhập hoặc mật
        khẩu</div>
      <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold"
        style="background:#8b5cf6; border-color:#8b5cf6; box-shadow: 0 4px 6px -1px rgba(139, 92, 246, 0.4);">Đăng
        Nhập</button>
    </form>
    <div class="mt-4 text-center small text-muted">
      <p class="mb-1"><strong>Tài khoản mẫu:</strong></p>
      Admin: <code>admin</code> / <code>admin123</code><br>
      User: <code>user</code> / <code>user123</code>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="login.js"></script>
</body>

</html>
