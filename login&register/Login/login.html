<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Flower Shop</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Boxicons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <!--Link css-->
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div class="side-image">
    <img src="../../Photo/Side-img.jpg" alt="Flower">
    <img src="../../Photo/Logo.png" alt="Flower Logo" class="icon-flower">
    <p class="brand-name">Flower Shop</p>
    <p class="brand-text">Shop hoa tươi đẳng cấp nhất thế giới được tạo ra bởi tôi </p>
  </div>
  <div class="login-card">
    <h3><i class='bx bxs-flower'></i> Flower Shop</h3>
    <p class="text-center text-muted mb-4">Vui lòng đăng nhập để tiếp tục</p>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class='bx bx-user'></i></span>
          <input type="email" class="form-control" id="email" required placeholder="Nhập email của bạn">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class='bx bx-lock-alt'></i></span>
          <input type="password" class="form-control border-end-0 " id="password" required
            placeholder="admin123 hoặc user123">
          <span class="input-group-text bg-white border-start-0 px-2 py-0">
            <label class="eye-container" style="--size: 18px; margin: 0 4px;">
              <input type="checkbox" id="togglePasswordBtn">
              <svg class="eye" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 576 512">
                <path
                  d="M288 32c-80.8 0-145.5 36.8-192.6 80.6C48.6 156 17.3 208 2.5 243.7c-3.3 7.9-3.3 16.7 0 24.6C17.3 304 48.6 356 95.4 399.4C142.5 443.2 207.2 480 288 480s145.5-36.8 192.6-80.6c46.8-43.5 78.1-95.4 93-131.1c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C433.5 68.8 368.8 32 288 32zM144 256a144 144 0 1 1 288 0 144 144 0 1 1 -288 0zm144-64c0 35.3-28.7 64-64 64c-7.1 0-13.9-1.2-20.3-3.3c-5.5-1.8-11.9 1.6-11.7 7.4c.3 6.9 1.3 13.8 3.2 20.7c13.7 51.2 66.4 81.6 117.6 67.9s81.6-66.4 67.9-117.6c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3z">
                </path>
              </svg>
              <svg class="eye-slash" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 640 512">
                <path
                  d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zM223.1 149.5C248.6 126.2 282.7 112 320 112c79.5 0 144 64.5 144 144c0 24.9-6.3 48.3-17.4 68.7L408 294.5c8.4-19.3 10.6-41.4 4.8-63.3c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3c0 10.2-2.4 19.8-6.6 28.3l-90.3-70.8zM373 389.9c-16.4 6.5-34.3 10.1-53 10.1c-79.5 0-144-64.5-144-144c0-6.9 .5-13.6 1.4-20.2L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.9 35.7 46.2 87.7 93 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5L373 389.9z">
                </path>
              </svg>
            </label>
          </span>
        </div>
      </div>
      <div id="loginError" class="alert alert-danger d-none py-2 text-center small">Sai tên đăng nhập hoặc mật
        khẩu</div>

      <div class="d-flex gap-2 mb-3">
        <button type="button" class="btn btn-primary flex-fill" title="facebook">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#ffffff">
            <path
              d="M13.397 20.997v-8.196h2.765l.411-3.209h-3.176V7.548c0-.926.258-1.56 1.587-1.56h1.684V3.127A22.336 22.336 0 0 0 14.201 3c-2.444 0-4.122 1.492-4.122 4.231v2.355H7.332v3.209h2.753v8.202h3.312z"
              fill="#ffffff" />
          </svg>
        </button>
        <button type="button" class="btn btn-secondary flex-fill" title="google">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#ffffff">
            <path
              d="M20.283 10.356h-8.327v3.451h4.792c-.446 2.193-2.313 3.453-4.792 3.453a5.27 5.27 0 0 1-5.279-5.28 5.27 5.27 0 0 1 5.279-5.279c1.259 0 2.397.447 3.29 1.178l2.6-2.599c-1.584-1.381-3.615-2.233-5.89-2.233a8.908 8.908 0 0 0-8.934 8.934 8.907 8.907 0 0 0 8.934 8.934c4.467 0 8.529-3.249 8.529-8.934 0-.528-.081-1.097-.202-1.625z"
              fill="#ffffff" />
          </svg>
        </button>
      </div>

      <div class="d-flex align-items-center gap-2">
        <label class="container m-0 p-0" style="width: max-content;">
          <input type="checkbox">
          <div class="checkmark"></div>
        </label>
        <p class="mb-0">Ghi nhớ đăng nhập</p>
      </div>
      <button type="submit" class="btn-login w-100 rounded-pill py-2 fw-semibold mt-4">
        Đăng nhập
      </button>
      <button type="button" id="guestLoginBtn" class="btn btn-outline-secondary w-100 rounded-pill py-2 fw-semibold mt-2">
        Tiếp tục với tài khoản khách
      </button>

    </form>
    <div class="reg-for mt-5 text-center gap-5">
      <div class="forgot mb-2"><a href="../Forgot/forgot.html">Không thể đăng nhập?</a></div>
      <div class="register"><a href="../Register/register.html">Tạo tài khoản</a></div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../AccountSystem/auth.js"></script>
  <script src="login.js"></script>
</body>

</html>
