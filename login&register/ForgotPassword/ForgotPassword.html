<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .form-container { background: white; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); padding: 40px; width: 100%; max-width: 400px; }
        .title { font-size: 28px; font-weight: 700; margin-bottom: 20px; text-align: center; color: #333; }
        .info-label { display: block; margin-bottom: 20px; color: #666; font-size: 14px; }
        .form-label { font-weight: 600; color: #555; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; width: 100%; }
        .btn-primary:hover { background: linear-gradient(135deg, #5568d3 0%, #6a3a8f 100%); }
    </style>
</head>
<body>
    <main>
        <div id="searchForm" class="form-container" role="region" aria-label="Quên mật khẩu">
            <p class="title">Quên mật khẩu</p>
            <p id="forgotPasswordMessage" class="alert alert-info" role="alert" style="display: none;"></p>
            <p class="info-label">Hãy nhập địa chỉ email của bạn để tìm lại tài khoản.</p>
            <form id="forgotPasswordForm" action="#" method="post">
                <div class="mb-3">
                    <label class="form-label" for="emailInput">Email</label>
                    <input type="email" class="form-control" id="emailInput" name="email" placeholder="name@example.com" autocomplete="email" required>
                </div>
                <button class="btn btn-primary btn-lg" type="submit" id="forgotPasswordBtn">Tìm kiếm</button>
            </form>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../AccountSystem/auth.js"></script>
    <script src="ForgotPassword.js"></script>
</body>
</html>
