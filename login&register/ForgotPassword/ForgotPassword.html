<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ForgotPassword.css">
    <title>Quên mật khẩu</title>
</head>
<body>
    <main class="page">
        <!-- Form tìm kiếm email -->
        <div id="searchForm" class="form-container" role="region" aria-label="Quên mật khẩu">
            <p class="title">Quên mật khẩu</p>
            <p id="forgotPasswordMessage" class="form-message" aria-live="polite"></p>
            <label class="info-label">
                <span class="info-text">Hãy nhập địa chỉ email của bạn để tìm lại tài khoản.</span>
            </label>
            <form class="form" id="forgotPasswordForm" action="#" method="post">
                <label class="form-label">
                    <span class="form-label">Email</span>
                    <input
                        type="email"
                        class="form-input"
                        id="emailInput"
                        name="email"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required
                    >
                </label>
                <div class="divider"></div>
                <button class="form-btn" type="submit" id="forgotPasswordBtn">Tìm kiếm</button>
            </form>
        </div>


    </main>
    
    <script src="../AccountSystem/auth.js"></script>
    <script src="ForgotPassword.js"></script>
</body>
</html>
