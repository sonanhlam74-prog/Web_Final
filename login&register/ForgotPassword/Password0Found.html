<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không tìm được tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .form-container { background: white; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); padding: 40px; width: 100%; max-width: 400px; }
        .notification-box { background: #ffebee; padding: 20px; border-radius: 8px; text-align: center; }
        .notification-title { font-weight: 700; color: #c62828; margin-bottom: 10px; }
        .notification-message { color: #555; font-size: 14px; }
        .link-text { color: #667eea; text-decoration: none; font-weight: 600; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-group .btn { flex: 1; }
    </style>
</head>
<body>
    <main>
        <div class="form-container" role="region" aria-label="Không tìm thấy tài khoản">
            <div class="notification-box">
                <p class="notification-title">Không tìm thấy tài khoản</p>
                <p class="notification-message">
                    Rất tiếc, không tìm thấy tài khoản được liên kết với email này. Vui lòng thử một email khác hoặc 
                    <a href="../Register/register.html" class="link-text">đăng ký tài khoản mới</a>.
                </p>
                <div class="btn-group">
                    <button class="btn btn-primary" type="button" id="tryAnotherBtn">Thử email khác</button>
                    <button class="btn btn-secondary" type="button" id="registerBtn">Đăng ký tài khoản</button>
                </div>
            </div>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../AccountSystem/auth.js"></script>
    <script src="Password0Found.js"></script>
</body>
</html>
