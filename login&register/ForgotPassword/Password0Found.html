<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Password0Found.css">
    <title>Không tìm được tài khoản</title>
</head>
<body>
    <main class="page">
        <div class="form-container" role="region" aria-label="Không tìm thấy tài khoản">
            <div class="notification-box error">
                <p class="notification-title">Không tìm thấy tài khoản</p>
                <p class="notification-message">
                    Rất tiếc, không tìm thấy tài khoản được liên kết với email này. Vui lòng thử một email khác hoặc 
                    <a href="../Register/register.html" class="link-text">đăng ký tài khoản mới</a>.
                </p>
                <div class="divider"></div>
                <div class="button-group">
                    <button class="form-btn" type="button" id="tryAnotherBtn">Thử email khác</button>
                    <button class="form-btn secondary" type="button" id="registerBtn">Đăng ký tài khoản</button>
                </div>
            </div>
        </div>
    </main>
    
    <script src="../AccountSystem/auth.js"></script>
    <script src="Password0Found.js"></script>
</body>
</html>
