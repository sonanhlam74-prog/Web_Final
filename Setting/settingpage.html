<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="settingpage.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <header class="top-nav">
       

        <div class="top-left-logo" aria-label="Settings">
            <span class="material-symbols-outlined" aria-hidden="true">settings</span>
            <p>Settings</p>
        </div>
        
        <form class="middle-search-bar" role="search" aria-label="Search settings" autocomplete="off">
            <label class="sr-only" for="Mysearch">Search settings</label>
            <input type="search" placeholder="Search settings" id="Mysearch" title="Type a category" >
        </form>
    </header>

    <nav class="side-nav side-nav--open" id="sideNav" aria-label="Settings categories">
        <a href="#"><span class="material-symbols-outlined" aria-hidden="true">person</span> You</a>
        <a href="#" id="passwordsLink"><span class="material-symbols-outlined" aria-hidden="true">password</span> Passwords</a>
        <a href="#"><span class="material-symbols-outlined" aria-hidden="true">shield</span> Privacy and security</a>
        <a href="#"><span class="material-symbols-outlined" aria-hidden="true">language</span> Languages</a>
        <a href="#"><span class="material-symbols-outlined" aria-hidden="true">download</span> Download</a>
        <a href="#"><span class="material-symbols-outlined" aria-hidden="true">build</span> System</a>
        <a href="#"><span class="material-symbols-outlined" aria-hidden="true">autorenew</span> Reset settings</a>
        <a href="#"><span class="material-symbols-outlined" aria-hidden="true">info</span> About</a>
        <p class="side-nav__empty" id="sideNavEmpty" hidden>No results</p>
    </nav>

    <main class="content" id="content" tabindex="-1">
        <h1 class="sr-only">Settings</h1>

        <section class="panel" aria-label="Đổi mật khẩu">
            <h2 class="panel__title">Đổi mật khẩu</h2>
            <p id="passwordMessage" class="form-message" aria-live="polite"></p>

            <form id="changePasswordForm" class="form" autocomplete="off">
                <label class="field">
                    <span class="field-label">Mật khẩu hiện tại</span>
                    <input class="input" type="password" name="oldPassword" required>
                </label>

                <label class="field">
                    <span class="field-label">Mật khẩu mới</span>
                    <input class="input" type="password" name="newPassword" required>
                </label>

                <label class="field">
                    <span class="field-label">Xác nhận mật khẩu mới</span>
                    <input class="input" type="password" name="confirmNewPassword" required>
                </label>

                <button class="btn" type="submit">Cập nhật mật khẩu</button>
            </form>
        </section>
    </main>
    <script src="../login&register/AccountSystem/auth.js"></script>
    <script src="settingpage.js"></script>
</body>
</html>
